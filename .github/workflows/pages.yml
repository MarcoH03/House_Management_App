name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Cada 4 horas: vuelve a publicar la app con las tasas de elTOque actualizadas
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js icons _site/
          # Versión única por despliegue para que el iPhone descargue la app nueva
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar tasas de elTOque
        env:
          ELTOQUE_API_TOKEN: ${{ secrets.ELTOQUE_API_TOKEN }}
        run: node .github/scripts/fetch-rates.mjs _site/rates.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
